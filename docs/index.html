      : mode === 'surprise' ? `Invent a ${CT.SLOTS[slot].en.toLowerCase()} recipe this person has probably never tried, matching their likes and blood work. ${brief ? 'Wishes: ' + brief : ''}`
      : `Create a ${CT.SLOTS[slot].en.toLowerCase()} recipe using mainly what they have: "${brief || 'anything cheap and available'}". You may add up to three cheap pantry or supermarket items.`;
    CT.ui.ai.draft = null;
    const ctl = start();
    try { CT.ui.ai.draft = await CT.ai.createRecipe(task, { onText: stream, signal: ctl.signal }); finish(); } catch (e) { fail(e); }
  };
  CT.actions['ai-save-recipe'] = (d) => {
    const r = CT.ui.ai.draft; if (!r) return;
    CT.state.custom.push(r); CT.save('custom'); CT.ui.ai.draft = null;
    CT.checkAchievements();
    if (d.today) { const slot = r.slots.find((s) => CT.state.prefs.meals[s]) || r.slots[0]; CT.setSlot(CT.today(), slot, r.id); CT.toast(`Saved and planned as today's ${CT.SLOTS[slot].en.toLowerCase()}.`, 'good'); CT.go('#/today'); }
    else { CT.toast('Saved to My recipes.', 'good'); CT.go('#/recipe/' + r.id); }
  };
  CT.actions['ai-discard'] = () => { CT.ui.ai.draft = null; CT.ui.ai.analysis = null; CT.render(); };
  CT.submits['ai-analyze'] = async (form) => {
    const f = new FormData(form); const text = String(f.get('text') || '').trim(); const photo = f.get('photo');
    const images = photo && photo.size ? [photo] : null;
    if (!text && !images) return;
    CT.ui.ai.analysis = null;
    const ctl = start();
    try {
      const a = await CT.ai.analyzeMeal(text, images, { signal: ctl.signal });
      if (!a || typeof a !== 'object') throw { code: 'invalid_json' };
      for (const k of ['kcal', 'p', 'c', 'fib', 'fat', 'sf', 'sug', 'na']) a[k] = Number(a[k]) || 0;
      a.name = String(a.name || text || 'Meal').slice(0, 80); a.verdict = ['good', 'ok', 'poor'].includes(a.verdict) ? a.verdict : 'ok';
      CT.ui.ai.analysis = a; finish();
    } catch (e) { fail(e); }
  };
  CT.actions['ai-log-meal'] = () => { const a = CT.ui.ai.analysis; if (!a) return; CT.logExtra({ name: a.name, kcal: a.kcal, p: a.p, sf: a.sf, sug: a.sug, fib: a.fib, na: a.na, verdict: a.verdict }); CT.ui.ai.analysis = null; CT.toast('Logged to today.', 'good'); CT.go('#/today'); };
  CT.actions['ai-text'] = async (d) => {
    const ctl = start(); CT.ui.ai.texts = CT.ui.ai.texts || {};
    try { const { text } = await (d.kind === 'review' ? CT.ai.weeklyReview({ onText: stream, signal: ctl.signal }) : CT.ai.explainLabs({ onText: stream, signal: ctl.signal })); CT.ui.ai.texts[d.kind] = text; finish(); } catch (e) { if (e && e.text) CT.ui.ai.texts[d.kind] = e.text; fail(e); }
  };

  // ---- Settings
  CT.views.settings = () => {
    const s = CT.state, likes = s.prefs.likes;
    const nLike = Object.values(likes).filter((v) => v === 1).length, nDis = Object.values(likes).filter((v) => v === -1).length;
    const sync = CT.syncStatus;
    const isArtifact = !!(window.claude && window.claude.use);
    return `<section class="settings">
      <div class="page-head"><div><p class="eyebrow">Settings</p><h1>Tune the planner.</h1></div></div>
      ${CT.ui.prefsDirty ? `<div class="banner">Preferences changed. <button class="btn sm primary" data-action="regen-week">Re-plan the week</button> <button class="btn sm ghost" data-action="dismiss-dirty">Later</button></div>` : ''}
      <div class="card"><h3>Profile & targets</h3>${CT.forms.profile()}</div>
      <div class="card"><h3>Health focus</h3>${CT.forms.focus()}</div>
      <div class="card"><h3>Diet & restrictions</h3>${CT.forms.diet()}</div>
      <div class="card"><div class="row-between"><h3>Likes & dislikes</h3><button class="btn ghost sm" data-action="edit-likes">${CT.icon('edit')} Edit</button></div><p class="muted">${nLike} liked · ${nDis} disliked foods.</p></div>
      <div class="card"><h3>Kitchen & time</h3>${CT.forms.kitchen()}</div>
      <div class="card"><h3>Appearance</h3>
        <div class="field"><span>Theme</span>${CT.seg('settings.theme', [['auto', 'Follow system'], ['light', 'Light'], ['dark', 'Dark']], s.settings.theme)}</div>
        <div class="field"><span>Palette</span><div class="palettes">${Object.entries(CT.PALETTES).map(([id, p]) => {
          const t = CT.isDark() ? p.dark : p.light;
          const on = (s.settings.palette || CT.DEFAULT_PALETTE) === id;
          return `<button type="button" class="pal ${on ? 'on' : ''}" data-action="set" data-path="settings.palette" data-value="${id}" aria-pressed="${on}">
            <span class="pal-swatch" style="background:${t.bg}"><i style="background:${t.accent}"></i><i style="background:${t.accent2}"></i><i style="background:${t.good}"></i></span>
            <span class="pal-body"><strong>${p.name}</strong><small>${p.hint}</small></span></button>`;
        }).join('')}</div></div>
      </div>
      <div class="card"><h3>Data</h3>
        <p class="muted small">${isArtifact ? (sync === 'synced' ? `${CT.icon('sync')} Synced through your Claude account: open this page on your phone and your data is there.` : sync === 'syncing' ? 'Syncing…' : sync === 'error' ? 'Sync had a problem; data is still saved on this device.' : 'Saved on this device.') : 'Saved in this browser only. Export a backup to move it to another device or to the claude.ai version.'}</p>
        <div class="row-gap wrap">
          <button class="btn ghost" data-action="export-data">${CT.icon('download')} Export backup</button>
          <button class="btn ghost" data-action="import-data">${CT.icon('upload')} Import backup</button>
          ${CT.installPrompt ? `<button class="btn primary" data-action="install">${CT.icon('install')} Install app</button>` : ''}
          <button class="btn ghost danger-text" data-action="reset-all">${CT.icon('trash')} Reset everything</button>
        </div>
        <p class="hint">Set up again from scratch: <button class="btn ghost xs" data-action="rerun-setup">Run the setup wizard</button></p>
      </div>
      <div class="card about"><h3>About</h3><p class="muted small">CookThis · build ${(window.CT_CONFIG || {}).build || 'dev'} · ${CT.RECIPES.length} built-in recipes, ${Object.keys(CT.ING).length} ingredients. Nutrition values are per-100 g averages from standard food tables and cost estimates are for Italian supermarkets in 2026; treat both as approximate. Not medical advice.</p></div>
    </section>`;
  };
  CT.actions['edit-likes'] = () => CT.openSetupAt('likes', '#/settings');
  CT.actions['rerun-setup'] = () => { CT.setup.step = 0; CT.setup.returnTo = '#/settings'; CT.go('#/setup'); };
  CT.actions['export-data'] = async () => {
    const text = CT.exportData(); const name = `cookthis-backup-${CT.today()}.json`;
    if (window.claude && window.claude.use) {
      let dl = null;
      try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
      if (dl) { try { await dl.save({ filename: name, data: text }); CT.toast('Backup saved.', 'good'); return; } catch (e) { if (e && e.code === 'cancelled') return; } }
    } else { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); } catch (e) { /* fall through */ } }
    try { await navigator.clipboard.writeText(text); CT.toast('Backup copied to the clipboard (and downloaded where allowed).', 'good'); } catch (e) { CT.dialog(`<h3>Your backup</h3><p class="muted small">Copy this text and paste it into Import on the other device.</p><textarea class="export" readonly>${CT.esc(text)}</textarea><div class="dlg-actions"><button class="btn primary" data-action="dlg-cancel">Done</button></div>`, { wide: true }); }
  };
  CT.actions['import-data'] = () => CT.dialog(`<h3>Import a backup</h3><form data-submit="import-save"><p class="muted small">Paste the backup text, or pick the file.</p><input type="file" accept="application/json,.json" data-change="import-file"><textarea class="export" name="text" placeholder="{ … }"></textarea><div class="dlg-actions"><button type="button" class="btn ghost" data-action="dlg-cancel">Cancel</button><button class="btn primary" type="submit">Import</button></div></form>`, { wide: true });
  CT.changes['import-file'] = (d, el) => { const f = el.files && el.files[0]; if (!f) return; f.text().then((t) => { const ta = CT.$('#dlg textarea'); if (ta) ta.value = t; }); };
  CT.submits['import-save'] = (form) => { try { CT.importData(String(new FormData(form).get('text') || '')); CT.closeDialog(); CT.applyTheme(); CT.toast('Imported.', 'good'); CT.go('#/today'); } catch (e) { CT.toast('That did not look like a CookThis backup.', 'bad'); } };
  CT.actions['reset-all'] = async () => { if (!(await CT.confirm('Reset everything?', 'Profile, preferences, plans, logs, custom recipes and lab entries are deleted on this device' + (CT.db ? ' and in your synced copy' : '') + '.', 'Reset', true))) return; CT.resetAll(); CT.closeDialog(); CT.setup.step = 0; CT.go('#/setup'); };
})();

} catch (ctLoadError) { console.error('CookThis: js/views-more.js failed to load', ctLoadError); }

// ==== js/app.js
try {
/* Router, shell rendering, event delegation and boot. */
(function () {
  const NAV = [['today', 'Today', 'today'], ['recipes', 'Recipes', 'recipes'], ['plan', 'Plan', 'plan'], ['shop', 'Shop', 'shop'], ['health', 'Health', 'health']];
  const MORE = [['swaps', 'Swap guide', 'swaps'], ['claude', 'Claude', 'claude'], ['settings', 'Settings', 'settings']];
  const TITLES = { today: 'Today', recipes: 'Recipes', recipe: 'Recipe', plan: 'Plan', shop: 'Shopping list', health: 'Health', swaps: 'Swap guide', claude: 'Claude', settings: 'Settings', setup: 'Setup' };

  CT.parseHash = () => {
    const raw = location.hash.replace(/^#\/?/, '');
    const [pathPart, qs] = raw.split('?');
    const parts = pathPart.split('/').filter(Boolean);
    const name = parts[0] || (CT.state.setupDone ? 'today' : 'setup');
    const params = { query: {} };
    if (name === 'recipe') params.id = decodeURIComponent(parts[1] || '');
    if (name === 'claude') params.tab = parts[1] || '';
    if (name === 'shop') params.scope = parts[1] || '';
    if (qs) for (const [k, v] of new URLSearchParams(qs)) params.query[k] = v;
    return { name, params };
  };
  CT.go = (hash) => { if (location.hash === hash) CT.render(); else location.hash = hash; };

  const navLink = ([key, label, icon], active, cls) => `<a class="${cls} ${active === key ? 'on' : ''}" href="#/${key}" ${active === key ? 'aria-current="page"' : ''}>${CT.icon(icon)}<span>${label}</span></a>`;
  const renderNav = (active) => {
    const rail = CT.$('#rail'), tab = CT.$('#tabbar'), top = CT.$('#topbar');
    const hide = !CT.state.setupDone || active === 'setup';
    rail.hidden = hide; tab.hidden = hide; top.hidden = hide;
    CT.$('#app').classList.toggle('no-nav', hide);
    if (hide) return;
    const st = CT.stats();
    rail.innerHTML = `<a class="brand" href="#/today">${CT.brandmark(34)}<span>CookThis</span></a>
      <nav class="rail-nav">${NAV.map((n) => navLink(n, active, 'rail-link')).join('')}<span class="rail-sep"></span>${MORE.map((n) => navLink(n, active, 'rail-link')).join('')}</nav>
      <div class="rail-foot"><span class="streak-chip" title="Cooking streak">${CT.icon('flame')} ${st.cookStreak}</span><span class="streak-chip alt" title="Days without cured meat">${st.slipFreeDays} salame-free</span><span id="syncbadge">${syncBadge()}</span></div>`;
    tab.innerHTML = NAV.map((n) => navLink(n, active, 'tab-link')).join('') + `<button class="tab-link ${MORE.some((m) => m[0] === active) ? 'on' : ''}" data-action="more-menu">${CT.icon('more')}<span>More</span></button>`;
    top.innerHTML = `<a class="brand" href="#/today">${CT.brandmark(28)}<span>CookThis</span></a>
      <div class="top-right"><span class="streak-chip" title="Cooking streak">${CT.icon('flame')} ${st.cookStreak}</span><span class="streak-chip alt" title="Days without cured meat">${st.slipFreeDays} <small>salame-free</small></span><span id="syncbadge-m">${syncBadge()}</span></div>`;
  };
  const syncBadge = () => CT.syncStatus === 'synced' ? `<span class="sync ok" title="Synced with your Claude account">${CT.icon('sync')}</span>` : CT.syncStatus === 'error' ? `<span class="sync bad" title="Sync problem, saved locally">${CT.icon('sync')}</span>` : '';
  CT.renderSyncBadge = () => { for (const id of ['#syncbadge', '#syncbadge-m']) { const el = CT.$(id); if (el) el.innerHTML = syncBadge(); } };

  CT.actions['more-menu'] = () => CT.dialog(`<h3>More</h3><div class="menu">${MORE.map(([k, l, i]) => `<a class="menu-item" href="#/${k}" data-action="dlg-cancel">${CT.icon(i)} ${l}</a>`).join('')}</div>`);
  CT.actions['dlg-cancel'] = (d, el, ev) => { if (CT._dlgResolve) { CT._dlgResolve(false); CT._dlgResolve = null; } CT.closeDialog(); if (el && el.tagName === 'A' && el.getAttribute('href')) location.hash = el.getAttribute('href'); };
  CT.actions['dlg-ok'] = () => { if (CT._dlgResolve) { CT._dlgResolve(true); CT._dlgResolve = null; } };
  CT.actions.install = async () => { const p = CT.installPrompt; if (!p) return; p.prompt(); try { await p.userChoice; } catch (e) { /* dismissed */ } CT.installPrompt = null; CT.ui.installBanner = false; CT.render(); };
  CT.actions['dismiss-install'] = () => { CT.ui.installBanner = false; try { localStorage.setItem('ct.installDismissed', '1'); } catch (e) { /* ignore */ } CT.render(); };

  const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  CT.isDark = () => { const t = (CT.state.settings || {}).theme || 'auto'; return t === 'dark' || (t === 'auto' && !!(darkQuery && darkQuery.matches)); };
  CT.applyTheme = () => {
    const s = CT.state.settings || {}, root = document.documentElement;
    if ((s.theme || 'auto') === 'auto') root.removeAttribute('data-theme'); else root.dataset.theme = s.theme;
    const pal = CT.PALETTES[s.palette] || CT.PALETTES[CT.DEFAULT_PALETTE];
    const tokens = CT.isDark() ? pal.dark : pal.light;
    for (const k in tokens) root.style.setProperty('--' + k, tokens[k]);
    root.dataset.palette = s.palette || CT.DEFAULT_PALETTE;
    for (const m of CT.$$('meta[name="theme-color"]')) m.setAttribute('content', tokens.accent);
  };
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', () => { if (((CT.state.settings || {}).theme || 'auto') === 'auto') CT.applyTheme(); });

  let lastRoute = '';
  CT.render = () => {
    const route = CT.route = CT.parseHash();
    if (!CT.state.setupDone && route.name !== 'setup') { location.hash = '#/setup'; return; }
    const view = CT.views[route.name] || CT.views.today;
    let html;
    try { html = view(route.params); } catch (e) { console.error(e); html = `<section><p class="empty">Something went wrong rendering this page. <button class="btn ghost sm" data-action="reload">Reload</button></p><pre class="stream">${CT.esc(e && e.stack || e)}</pre></section>`; }
    CT.$('#view').innerHTML = html;
    renderNav(route.name);
    CT.applyTheme();
    document.title = (TITLES[route.name] ? TITLES[route.name] + ' · ' : '') + 'CookThis';
    const key = route.name + '/' + (route.params.id || route.params.tab || route.params.scope || '');
    if (key !== lastRoute) { window.scrollTo(0, 0); lastRoute = key; }
    if (CT.after[route.name]) CT.after[route.name](route.params);
    const chat = CT.$('#chat'); if (chat) chat.scrollTop = chat.scrollHeight;
  };
  CT.actions.reload = () => location.reload();

  // ---- Event delegation
  // Forms are driven from the click, not from the browser's own submit: the artifact viewer frames
  // the page in a sandbox that blocks form submission, so a native submit event never arrives there.
  const runForm = (form, e) => {
    if (typeof form.reportValidity === 'function' && !form.reportValidity()) return;
    const fn = (CT.submits || {})[form.dataset.submit];
    if (!fn) return;
    try { fn(form, e); } catch (err) { console.error(err); CT.toast('That did not go through. Try again.', 'bad'); }
  };
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn && btn.type === 'submit') {
      const form = btn.closest('form[data-submit]');
      if (form) { e.preventDefault(); runForm(form, e); return; }
    }
    const a = e.target.closest('[data-action]'); if (!a) return;
    const fn = CT.actions[a.dataset.action]; if (!fn) return;
    e.preventDefault();
    fn(a.dataset, a, e);
  });
  document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (!el) return; const fn = CT.changes[el.dataset.change]; if (fn) fn(el.dataset, el, e); });
  document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (!el) return; const fn = (CT.inputs || {})[el.dataset.input]; if (fn) fn(el.dataset, el, e); });
  document.addEventListener('submit', (e) => { const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault(); runForm(f, e); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { const cm = CT.$('#cookmode'); if (cm && !cm.hidden) CT.actions['cook-close'](); return; }
    if (e.key !== 'Enter') return;
    const el = e.target;
    if (!el || !el.closest) return;
    const form = el.closest('form[data-submit]'); if (!form) return;
    // Enter sends from a single-line field; in a textarea it needs Ctrl or Cmd, so newlines still work.
    const isText = el.tagName === 'TEXTAREA';
    if (isText ? (e.ctrlKey || e.metaKey) : (el.tagName === 'INPUT' && !/checkbox|radio|file/.test(el.type) && !e.shiftKey)) {
      e.preventDefault();
      runForm(form, e);
    }
  });

  // ---- Boot
  const boot = async () => {
    CT.load();
    CT.applyTheme();
    CT._day = CT.today();
    const hasClaude = !!(window.claude && typeof window.claude.use === 'function');
    if (hasClaude && !CT.state.setupDone) {
      const splash = CT.$('#splash'); splash.hidden = false;
      await Promise.race([CT.syncInit(), new Promise((r) => setTimeout(r, 6000))]);
      splash.hidden = true;
    } else if (hasClaude) {
      CT.syncInit();
    }
    if (!location.hash) location.hash = CT.state.setupDone ? '#/today' : '#/setup';
    CT.render();
    window.addEventListener('hashchange', CT.render);
    CT.ai.get().then(() => { if (CT.ai.available()) CT.render(); });
    setInterval(() => { if (CT.today() !== CT._day) { CT._day = CT.today(); CT.render(); } }, 60000);
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); CT.installPrompt = e; let dismissed = false; try { dismissed = !!localStorage.getItem('ct.installDismissed'); } catch (err) { /* ignore */ } if (!dismissed && CT.state.setupDone) { CT.ui.installBanner = true; CT.render(); } });
    window.addEventListener('appinstalled', () => { CT.installPrompt = null; CT.ui.installBanner = false; CT.toast('Installed. Find CookThis on your home screen.', 'good'); CT.render(); });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

} catch (ctLoadError) { console.error('CookThis: js/app.js failed to load', ctLoadError); }
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').then((reg) => {
    // A new build was fetched in the background: offer a one-tap reload.
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing; if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
          const t = document.createElement('button'); t.className = 'toast toast-good show'; t.style.pointerEvents = 'auto'; t.style.border = '0'; t.style.cursor = 'pointer';
          t.textContent = 'CookThis was updated. Tap to reload.'; t.onclick = () => location.reload();
          document.getElementById('toasts').appendChild(t);
        }
      });
    });
  }).catch(() => {}));
}
</script>
</body>
</html>
