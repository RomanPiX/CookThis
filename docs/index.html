<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#16557E">
<meta name="description" content="CookThis: a fast, lazy-cook-friendly meal planner tuned to your blood work.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CookThis">
<title>CookThis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* CookThis — tokens.
   The default palette (Mediterraneo) lives here so the page is painted correctly before any
   script runs. Choosing another palette in Settings sets the same variables inline on :root,
   from the table in js/palettes.js. Brand accents are deliberately a different hue from the
   good / warning / bad colours, so status never has to compete with branding. */
:root {
  --bg: #F1F5F7; --card: #FFFFFF; --soft: #E4EDF2; --ink: #12232F; --muted: #55697A; --line: #D2DFE7;
  --accent: #16557E; --accent-ink: #FFFFFF; --accent-soft: #DAE9F3; --accent-strong: #0E4266;
  --accent2: #DE9433; --accent2-soft: #FAEBD5; --accent2-ink: #6A4207;
  --bad: #C0453A; --bad-soft: #F8DEDB; --warn: #B0761A; --warn-soft: #F8EAD2; --good: #2C7A55; --good-soft: #D9EFE4; --info: #0F7B84; --info-soft: #D6EEF0;
  --shadow: 0 1px 2px rgba(16, 35, 47, .06), 0 10px 28px rgba(16, 35, 47, .09);
  --r: 16px; --r-sm: 10px;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D161E; --card: #15212B; --soft: #1D2B36; --ink: #E6EFF4; --muted: #92A6B4; --line: #293A47;
    --accent: #6EB2DB; --accent-ink: #07141E; --accent-soft: #1A3345; --accent-strong: #92C8EA;
    --accent2: #EDB264; --accent2-soft: #382C19; --accent2-ink: #F6DBAC;
    --bad: #E88A7A; --bad-soft: #3B2521; --warn: #E0B357; --warn-soft: #3A3120; --good: #63C094; --good-soft: #163629; --info: #52BEC7; --info-soft: #103138;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D161E; --card: #15212B; --soft: #1D2B36; --ink: #E6EFF4; --muted: #92A6B4; --line: #293A47;
  --accent: #6EB2DB; --accent-ink: #07141E; --accent-soft: #1A3345; --accent-strong: #92C8EA;
  --accent2: #EDB264; --accent2-soft: #382C19; --accent2-ink: #F6DBAC;
  --bad: #E88A7A; --bad-soft: #3B2521; --warn: #E0B357; --warn-soft: #3A3120; --good: #63C094; --good-soft: #163629; --info: #52BEC7; --info-soft: #103138;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

/* base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 700; line-height: 1.1; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
h4 { font-size: 14px; font-weight: 600; margin-top: 12px; }
p { margin: 0 0 8px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 11px; width: 100%; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, .glass:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea { resize: vertical; min-height: 60px; }
small { font-size: 12.5px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.ic { width: 18px; height: 18px; flex: 0 0 auto; vertical-align: -3px; }
.eyebrow { font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.eyebrow .sep { opacity: .5; margin: 0 2px; }
.lede { font-size: 16px; color: var(--muted); max-width: 62ch; }
.hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.it { font-style: italic; color: var(--muted); font-weight: 400; }
em.it { font-style: italic; color: var(--muted); }
.good-t { color: var(--good); } .bad-t { color: var(--bad); }
.empty { color: var(--muted); padding: 24px; text-align: center; grid-column: 1 / -1; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.row-gap { display: flex; align-items: center; gap: 8px; }
.row-gap.wrap { flex-wrap: wrap; }
.span2 { grid-column: 1 / -1; }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.table-wrap { overflow-x: auto; }
.vsep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; align-self: center; }

/* layout */
.app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }
.view, .grid-today > *, .col-main, .col-side, .slot-card, .card { min-width: 0; }
.slot-title, .rcard h3, .plan-name, h1, h2, h3 { overflow-wrap: anywhere; }
.rail { display: none; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar[hidden], .tabbar[hidden], .rail[hidden] { display: none; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--ink); }
.brand:hover { text-decoration: none; }
.top-right { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
@media (max-width: 420px) { .top-right .streak-chip small { display: none; } .brand span { display: none; } }
.view { padding: 16px 16px 96px; max-width: 1120px; width: 100%; margin: 0 auto; }
.tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: grid; grid-template-columns: repeat(6, 1fr); background: var(--card); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
.tab-link { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border: 0; background: none; color: var(--muted); font-size: 11px; border-radius: var(--r-sm); }
.tab-link .ic { width: 22px; height: 22px; }
.tab-link.on { color: var(--accent); }
.tab-link:hover { text-decoration: none; background: var(--soft); }
.streak-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; background: var(--soft); font-size: 13px; font-weight: 600; white-space: nowrap; }
.streak-chip.alt { background: var(--accent2-soft); color: var(--accent2-ink); }
.streak-chip small { font-weight: 400; }
.sync { display: inline-flex; padding: 4px; color: var(--muted); }
.sync.ok { color: var(--good); } .sync.bad { color: var(--bad); }
@media (min-width: 900px) {
  .app { grid-template-columns: 224px 1fr; grid-template-rows: 1fr; }
  .rail { display: flex; flex-direction: column; gap: 18px; padding: 22px 16px; border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; background: var(--bg); }
  .rail-nav { display: flex; flex-direction: column; gap: 2px; }
  .rail-link { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r-sm); color: var(--ink); font-weight: 500; }
  .rail-link:hover { background: var(--soft); text-decoration: none; }
  .rail-link.on { background: var(--accent); color: var(--accent-ink); }
  .rail-sep { height: 1px; background: var(--line); margin: 8px 4px; }
  .rail-foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .topbar, .tabbar { display: none; }
  .view { padding: 36px 40px 60px; }
}
/* Setup wizard: no navigation, so the content takes the whole width on every screen size. */
.app.no-nav { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr; }
.app.no-nav .view { padding-top: 28px; }

/* brand mark: drawn from the live palette */
.brandmark { flex: 0 0 auto; }
.brandmark .bm-bg { fill: var(--accent); }
.brandmark .bm-bowl { fill: var(--card); }
.brandmark .bm-steam { fill: none; stroke: var(--accent2); stroke-width: 5; stroke-linecap: round; }

/* palette picker */
.palettes { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.pal { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card); cursor: pointer; text-align: left; }
.pal:hover { background: var(--soft); }
.pal.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pal-swatch { display: inline-flex; align-items: center; gap: 3px; padding: 6px; border-radius: 8px; border: 1px solid var(--line); flex: 0 0 auto; }
.pal-swatch i { width: 12px; height: 20px; border-radius: 3px; display: block; }
.pal-body { display: flex; flex-direction: column; min-width: 0; }
.pal-body small { color: var(--muted); }

/* page head */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r-sm); background: var(--accent2-soft); color: var(--accent2-ink); margin-bottom: 14px; font-size: 14px; }
.banner.install { background: var(--accent-soft); color: var(--ink); }
.banner.bad { background: var(--bad-soft); color: var(--ink); }

/* buttons & chips */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; border: 1px solid transparent; background: var(--soft); color: var(--ink); font-weight: 500; cursor: pointer; line-height: 1.2; white-space: nowrap; transition: background .15s, transform .05s; }
.btn:hover { text-decoration: none; filter: brightness(.97); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.ghost:hover { background: var(--soft); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.danger-text { color: var(--bad); }
.btn.done { background: var(--accent-soft); color: var(--accent-strong); }
.btn.fav-on { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.btn.sm { padding: 6px 11px; font-size: 13.5px; }
.btn.xs { padding: 4px 8px; font-size: 12.5px; }
.btn.big { padding: 12px 22px; font-size: 16px; }
.btn.icon-only { padding: 6px; }
.btn.icon-only.xs { padding: 4px; }
.btn.on { background: var(--accent2-soft); color: var(--accent2-ink); border-color: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.big .chip { padding: 9px 14px; font-size: 14px; }
.chips.tiny { gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 13.5px; cursor: pointer; line-height: 1.3; }
.chip em { color: var(--muted); font-size: 12px; }
.chip:hover { background: var(--soft); text-decoration: none; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.on em { color: inherit; opacity: .8; }
.chip.on.like { background: var(--accent); color: var(--accent-ink); }
.chip.on.dislike, .chip.on.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.on.alt { background: var(--accent2-soft); color: var(--accent2-ink); border-color: transparent; }
.chip.tiny { padding: 2px 8px; font-size: 12px; cursor: default; background: var(--soft); border-color: transparent; color: var(--muted); }
.chip.tiny.warn { background: var(--warn-soft); color: var(--warn); }
.chip-x { border: 0; background: none; padding: 0 2px; cursor: pointer; display: inline-flex; color: var(--muted); }
.chip-x .ic { width: 13px; height: 13px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
/* Badges say "good for this"; they take status colours, never the brand accent, so a red palette
   cannot make a benefit look like a warning. Cautions are outlined instead of filled, so they read
   as a different kind of thing whatever the hue. */
.badge { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--good-soft); color: var(--good); letter-spacing: .01em; border: 1px solid transparent; }
.badge.b-tg { background: var(--info-soft); color: var(--info); }
.badge.b-uric, .badge.b-thyroid { background: var(--accent2-soft); color: var(--accent2-ink); }
.badge.warn { background: transparent; border-color: var(--warn); color: var(--warn); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; border-radius: 12px; background: var(--soft); }
.seg-btn { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg-btn.active { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; margin-bottom: 14px; }
.card.soft { background: var(--soft); border-color: transparent; }
.card h3 { margin-bottom: 6px; }
.note { padding: 10px 12px; border-left: 3px solid var(--accent2); background: var(--accent2-soft); color: var(--ink); border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: 14px; }

/* forms */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.field small { color: var(--muted); }
.field.inline { flex-direction: row; align-items: center; gap: 12px; margin-top: 12px; }
.field.inline input { width: auto; }
.field.file input { padding: 6px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer; }
.switch-row span { display: flex; flex-direction: column; }
.switch-row input { width: 22px; height: 22px; accent-color: var(--accent); flex: 0 0 auto; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.export { width: 100%; min-height: 160px; font: 12px/1.4 ui-monospace, monospace; }
.notes { min-height: 90px; }

/* setup */
.setup { max-width: 720px; margin: 0 auto; padding-top: 8px; }
.setup-progress { display: flex; gap: 6px; margin-bottom: 18px; }
.setup-progress .dot { width: 26px; height: 5px; border-radius: 3px; background: var(--line); }
.setup-progress .dot.on { background: var(--accent); }
.setup-title { margin-bottom: 8px; }
.setup-body { margin: 18px 0 22px; }
.setup-nav { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }
.welcome .lede { color: var(--ink); font-size: 17px; }
.feature-list { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 12px; }
.feature-list li { display: flex; gap: 12px; align-items: flex-start; }
.feature-list .ic { width: 22px; height: 22px; color: var(--accent); margin-top: 2px; }
.focus-list { display: grid; gap: 8px; }
.focus-card { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card); cursor: pointer; }
.focus-card.on { border-color: var(--accent); background: var(--accent-soft); }
.focus-check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; color: transparent; margin-top: 2px; }
.focus-card.on .focus-check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.focus-check .ic { width: 14px; height: 14px; }
.focus-body { display: flex; flex-direction: column; gap: 4px; }
.lab-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.lab-chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--soft); color: var(--muted); }
.lab-chip.high, .lab-chip.low { background: var(--bad-soft); color: var(--bad); }
.lab-chip.watch { background: var(--warn-soft); color: var(--warn); }
.lab-chip.ok { background: var(--good-soft); color: var(--good); }
.pref-group { margin: 14px 0; }
.pref-group h4 { margin: 0 0 6px; }
.ready .lede { color: var(--ink); }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 14px 0; }
.stat-row.compact { grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); }
.stat { display: flex; flex-direction: column; padding: 12px; border-radius: var(--r-sm); background: var(--soft); }
.stat-n { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1.1; }
.stat-n small { font-size: 13px; font-weight: 500; color: var(--muted); }
.stat-l { font-size: 12.5px; color: var(--muted); }
.stat-t { font-size: 12px; color: var(--muted); margin-top: 4px; }
.stat-why { font-size: 12px; margin-top: 6px; }
.stat.high .stat-n { color: var(--bad); } .stat.watch .stat-n { color: var(--warn); } .stat.ok .stat-n { color: var(--good); }

/* today */
.grid-today { display: grid; gap: 16px; }
@media (min-width: 900px) { .grid-today { grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); align-items: start; } }
.slot-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow); }
.slot-card.done { background: var(--soft); box-shadow: none; }
.slot-card.done .slot-title { text-decoration: line-through; color: var(--muted); }
.slot-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.slot-head .meta { margin-left: 8px; }
.meta { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.meta .ic { width: 15px; height: 15px; }
.slot-title { display: block; font-family: var(--display); font-size: 21px; font-weight: 600; line-height: 1.2; color: var(--ink); margin: 2px 0 4px; }
.slot-why { font-size: 13.5px; margin: 0; }
.slot-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.extras.card { margin-top: 4px; }
.extra-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
.extra-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bars { display: grid; gap: 8px; margin-top: 10px; }
.bar-row { display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.bar-label { color: var(--muted); }
.bar-track { position: relative; height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; display: flex; }
.bar-fill { height: 100%; border-radius: 4px; background: var(--good); transition: width .4s; }
.bar-fill.warn { background: var(--warn); } .bar-fill.bad { background: var(--bad); } .bar-fill.low { background: var(--line); } .bar-fill.good { background: var(--good); } .bar-fill.ok { background: var(--info); }
.bar-over { height: 100%; background: var(--bad); opacity: .5; }
.bar-val { text-align: right; min-width: 72px; }
.bar-val small { color: var(--muted); }
.glasses { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.glass { width: 30px; height: 38px; border-radius: 6px 6px 10px 10px; border: 1.5px solid var(--info); background: transparent; cursor: pointer; position: relative; padding: 0; }
.glass.full { background: var(--info-soft); }
.glass.full::after { content: ""; position: absolute; left: 3px; right: 3px; bottom: 3px; height: 60%; border-radius: 3px 3px 7px 7px; background: var(--info); opacity: .8; }
.streaks { display: grid; gap: 8px; }
.streak-row { display: flex; align-items: baseline; gap: 10px; }

/* Small utilities: DOM, formatting, dates, dialogs, icons. */
CT.$ = (sel, root) => (root || document).querySelector(sel);
CT.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
CT.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
CT.fmt = (n, d = 0) => (n == null || isNaN(n)) ? '–' : Number(n).toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
CT.eur = (n) => '€' + CT.fmt(n, 2);
// Plain text from Claude into safe paragraphs.
CT.prose = (t) => CT.esc(t).split(/\n{2,}/).map((x) => '<p>' + x.replace(/\n/g, '<br>') + '</p>').join('');
CT.clamp = (n, a, b) => Math.max(a, Math.min(b, n));
CT.uid = () => Math.random().toString(36).slice(2, 10);
CT.debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
CT.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
CT.hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
CT.sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);

// ---- Dates (local, ISO yyyy-mm-dd)
CT.today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
CT.parseISO = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
CT.addDays = (iso, n) => { const d = CT.parseISO(iso); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
CT.daysBetween = (a, b) => Math.round((CT.parseISO(b) - CT.parseISO(a)) / 86400000);
CT.fmtDate = (iso, style) => {
  const d = CT.parseISO(iso);
  if (style === 'short') return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  if (style === 'day') return d.toLocaleDateString('en-GB', { weekday: 'long' });
  if (style === 'month') return d.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
  if (style === 'num') return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
  return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
};
CT.relDay = (iso) => { const n = CT.daysBetween(CT.today(), iso); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n === -1 ? 'Yesterday' : CT.fmtDate(iso, 'short'); };

// ---- Toasts
CT.toast = (msg, kind) => {
  let host = CT.$('#toasts');
  if (!host) { host = document.createElement('div'); host.id = 'toasts'; document.body.appendChild(host); }
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' toast-' + kind : '');
  t.textContent = msg;
  host.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2600);
};

// ---- Dialog
CT.dialog = (html, opts = {}) => {
  const dlg = CT.$('#dlg');
  dlg.innerHTML = `<div class="dlg-inner ${opts.wide ? 'wide' : ''}">${html}</div>`;
  if (!dlg.open) dlg.showModal();
  dlg.onclick = (e) => { if (e.target === dlg && !opts.sticky) CT.closeDialog(); };
  if (opts.onOpen) opts.onOpen(dlg);
  return dlg;
};
CT.closeDialog = () => { const dlg = CT.$('#dlg'); if (dlg && dlg.open) dlg.close(); if (dlg) dlg.innerHTML = ''; };

  CT._dlgResolve = resolve;
});

};

// ---- Tiny sparkline (SVG string). points: [{x: index, y: value}]; band: [lo, hi] reference range.
CT.sparkline = (values, opts = {}) => {
  const w = opts.w || 160, h = opts.h || 44, pad = 4;
  const vals = values.filter((v) => v != null);
  if (!vals.length) return '';
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (opts.band) { lo = Math.min(lo, opts.band[0] ?? lo); hi = Math.max(hi, opts.band[1] ?? hi); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const x = (i) => pad + (values.length === 1 ? (w - 2 * pad) / 2 : (i * (w - 2 * pad)) / (values.length - 1));
  const y = (v) => h - pad - ((v - lo) / (hi - lo)) * (h - 2 * pad);
  let band = '';
  if (opts.band) {
    const b0 = opts.band[0] == null ? lo : opts.band[0], b1 = opts.band[1] == null ? hi : opts.band[1];
    band = `<rect x="0" y="${y(b1).toFixed(1)}" width="${w}" height="${Math.max(1, y(b0) - y(b1)).toFixed(1)}" class="spark-band"/>`;
  }
  const pts = values.map((v, i) => (v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`)).filter(Boolean);
  const last = values.length - 1;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${band}
    ${pts.length > 1 ? `<polyline points="${pts.join(' ')}" class="spark-line"/>` : ''}
    ${values[last] != null ? `<circle cx="${x(last).toFixed(1)}" cy="${y(values[last]).toFixed(1)}" r="3" class="spark-dot"/>` : ''}
  </svg>`;
};

// ==== js/nutrition.js
try {
/* Nutrition engine: normalises recipes, computes totals, cost, purine load, benefit scores and daily targets. */
(function () {
  const ZERO = () => ({ kcal: 0, p: 0, c: 0, fib: 0, fat: 0, sf: 0, sug: 0, na: 0, o3: 0, cost: 0 });

  // Normalise one ingredient entry: [id, g, disp?, opt?] or a custom object {name, it, g, per100, ...}
  CT.ingObj = (e) => {
    if (Array.isArray(e)) {
      const base = CT.ING[e[0]];
      if (!base) return null;
      const g = e[1];
      const disp = e[2] || (CT.LIQUID.has(e[0]) ? `${CT.fmt(g)} ml` : `${CT.fmt(g)} g`);
      return { id: e[0], en: base.en, it: base.it, aisle: base.aisle, g, disp, opt: !!e[3], per100: base.per100, price: base.price, tag: base.tag, flags: base.flags, o3: base.o3, pur: base.pur, pack: base.pack };
    }
    if (e && typeof e === 'object') {
      if (e.id && CT.ING[e.id]) return CT.ingObj([e.id, e.g, e.disp, e.opt]);
      return { id: null, en: e.name || 'Ingredient', it: e.it || '', aisle: e.aisle || 'Canned & dry', g: Number(e.g) || 0, disp: e.disp || `${CT.fmt(e.g)} g`, opt: !!e.opt, per100: Object.assign({ kcal: 0, p: 0, c: 0, fib: 0, fat: 0, sf: 0, sug: 0, na: 0 }, e.per100 || {}), price: e.price || 5, tag: e.tag || '', flags: e.flags || '', o3: e.o3 || 0, pur: e.pur || 0, pack: null };
    }
    return null;
  };

  CT.addNutri = (acc, ing, factor = 1) => {
    const k = (ing.g * factor) / 100;
    for (const f of ['kcal', 'p', 'c', 'fib', 'fat', 'sf', 'sug', 'na']) acc[f] += (ing.per100[f] || 0) * k;
    acc.o3 += (ing.o3 || 0) * k;
    acc.cost += ((ing.price || 0) * ing.g * factor) / 1000;
    return acc;
  };

  const LEGUME_TAGS = new Set(['chickpeas', 'beans', 'lentils', 'peas', 'hummus', 'soy']);
  const LDL_HELPERS = new Set(['oats', 'walnuts', 'almonds', 'peanuts', 'seeds', 'oliveoil', 'avocado', 'chickpeas', 'beans', 'lentils', 'peas', 'farro']);
  // Grams of meat, poultry and fish on the plate. Purines come with these, so a day's total is worth
  // watching when uric acid is above range, whatever the calories say.
  const ANIMAL_TAGS = new Set(['chicken', 'turkey', 'beef', 'bresaola', 'tuna', 'salmon', 'mackerel', 'sardines', 'codfish', 'seabass', 'shrimp', 'smokedsalmon']);
  const PROTEIN_TAGS = new Set(['tuna', 'salmon', 'mackerel', 'sardines', 'codfish', 'shrimp', 'smokedsalmon', 'chicken', 'turkey', 'beef', 'bresaola', 'eggs', 'chickpeas', 'beans', 'lentils', 'soy', 'yogurt', 'ricotta', 'cottage', 'mozzarella']);

  CT.computeBenefits = (r) => {
    const n = r.nutri, b = { ldl: 0, tg: 0, uric: 0, liver: 0, glucose: 0, thyroid: 0 }, why = [];
    const hasTag = (set, minG) => r.ings.some((i) => set.has(i.tag) && i.g >= (minG || 10));
    // LDL: soluble fibre, low saturated fat, specific helper foods
    if (n.fib >= 6) b.ldl++; if (n.fib >= 10) b.ldl++;
    if (n.sf <= 3) b.ldl++;
    if (hasTag(LDL_HELPERS, 15)) b.ldl++;
    if (n.sf > 7) b.ldl -= 2;
    // Triglycerides: omega-3, low sugar, fibre
    if (n.o3 >= 1) b.tg += 2; else if (n.o3 >= 0.4) b.tg += 1;
    if (n.sug <= 12) b.tg++;
    if (n.fib >= 6) b.tg++;
    if (n.sug > 25) b.tg -= 2;
    // Uric acid: purine load, low-fat dairy, cherries / vitamin C
    b.uric = r.purine <= 1 ? 2 : r.purine === 2 ? 1 : -1;
    if (r.ings.some((i) => ['yogurt', 'milk', 'cottage', 'ricotta'].includes(i.tag) && i.g >= 40)) b.uric++;
    if (r.ings.some((i) => ['cherries', 'orange', 'kiwi', 'strawberries', 'lemon'].includes(i.tag) && i.g >= 15)) b.uric++;
    // Liver: low saturated fat + low sugar + fibre
    if (n.sf <= 4) b.liver++; if (n.sug <= 12) b.liver++; if (n.fib >= 6) b.liver++;
    if (n.sug > 25 || n.sf > 8) b.liver -= 2;
    // Glucose: fibre, protein, low sugar
    if (n.fib >= 6) b.glucose++; if (n.p >= 15) b.glucose++; if (n.sug <= 12) b.glucose++;
    // Thyroid: iodine and selenium sources
    const iod = r.ings.filter((i) => i.flags.includes('I') && i.g >= 30).length;
    const sel = r.ings.filter((i) => i.flags.includes('L') && i.g >= 10).length;
    if (iod) b.thyroid++; if (sel) b.thyroid++; if (r.fish) b.thyroid++;
    for (const k in b) b[k] = CT.clamp(b[k], -2, 3);
    // Reasons shown to the user
    if (n.fib >= 10) why.push(`${CT.fmt(n.fib)} g fibre`); else if (n.fib >= 6) why.push(`${CT.fmt(n.fib)} g fibre`);
    if (n.o3 >= 0.4) why.push(`omega-3 ${CT.fmt(n.o3, 1)} g`);
    if (n.sf <= 3) why.push(`only ${CT.fmt(n.sf, 1)} g saturated fat`);
    if (n.p >= 25) why.push(`${CT.fmt(n.p)} g protein`);
    if (hasTag(LEGUME_TAGS, 60)) why.push('legumes');
    if (r.purine >= 3) why.push('purine-rich: max once a week');
    if (n.na > 1200) why.push(`salty (${CT.fmt(n.na)} mg sodium)`);
    r.benefits = b; r.why = why;
  };

  CT.prepRecipe = (r) => {
    if (r._prepped) return r;
    r.ings = (r.ing || []).map(CT.ingObj).filter(Boolean);
    r.nutri = r.ings.reduce((acc, i) => CT.addNutri(acc, i), ZERO());
    r.cost = r.nutri.cost;
    r.serves = r.serves || 1;
    r.tags = r.tags || []; r.needs = r.needs || []; r.slots = r.slots || ['L'];
    r.purine = Math.max(0, ...r.ings.filter((i) => i.g >= 40 || (i.pur >= 3 && i.g >= 25)).map((i) => i.pur));
    if (r.tags.includes('purine-high')) r.purine = 3;
    const flags = new Set(r.ings.flatMap((i) => i.flags.split('')));
    r.allergens = ['D', 'G', 'N', 'E', 'F', 'S', 'Y', 'Z'].filter((a) => flags.has(a));
    r.fish = flags.has('F') || flags.has('S');
    r.meat = flags.has('M');
    r.redmeat = flags.has('R') || r.tags.includes('redmeat');
    r.veg = !r.fish && !r.meat;
    r.vegan = r.veg && !flags.has('D') && !flags.has('E');
    r.eggs = r.ings.some((i) => i.tag === 'eggs' && i.g >= 50);
    r.legume = r.ings.some((i) => LEGUME_TAGS.has(i.tag) && i.g >= 60);
    r.foods = Array.from(new Set(r.ings.filter((i) => !i.opt && i.tag && i.g >= 5).map((i) => i.tag)));
    const prot = r.ings.filter((i) => PROTEIN_TAGS.has(i.tag)).sort((a, b) => b.g * b.per100.p - a.g * a.per100.p)[0];
    r.mainProtein = prot ? prot.tag : null;
    r.mins = r.active || r.time || 10;
    r.italian = r.tags.includes('italian') || CT.ITALIAN.has(r.id);
    r.animalG = r.ings.reduce((a, i) => a + (ANIMAL_TAGS.has(i.tag) ? i.g : 0), 0);
    CT.computeBenefits(r);
    r._prepped = true;
    return r;
  };

  let cache = null, cacheKey = '';
  CT.recipes = () => {
    const custom = (CT.state && CT.state.custom) || [];
    const key = custom.length + ':' + custom.map((c) => c.id).join(',');
    if (cache && key === cacheKey) return cache;
    cache = [...CT.RECIPES, ...custom].map(CT.prepRecipe);
    cacheKey = key;
    return cache;
  };
  CT.recipe = (id) => CT.recipes().find((r) => r.id === id) || null;

  // ---- Daily targets from the profile (Mifflin-St Jeor)
  CT.targets = () => {
    const p = (CT.state && CT.state.profile) || {};
    const w = Number(p.weight) || 80, h = Number(p.height) || 178, age = Number(p.age) || 32;
    const bmr = p.sex === 'f' ? 10 * w + 6.25 * h - 5 * age - 161 : 10 * w + 6.25 * h - 5 * age + 5;
    const act = (CT.ACTIVITY.find((a) => a[0] === p.activity) || CT.ACTIVITY[1])[2];
    let kcal = bmr * act;
    if (p.goal === 'lose') kcal = Math.max(1600, kcal * 0.85);
    kcal = Math.round(kcal / 10) * 10;
    return {
      kcal,
      p: Math.round(Math.max(1.2 * w, 0.2 * kcal / 4)),
      fib: 30,
      sf: Math.round((kcal * 0.07) / 9),
      sug: 60,
      na: 2000,
      o3: 1.5,
      water: 8,
      bmi: w / ((h / 100) ** 2),
    };
  };

  CT.sumNutri = (recipesList) => recipesList.reduce((acc, r) => { for (const k in acc) acc[k] += r.nutri[k] || 0; return acc; }, ZERO());
  // Same, with a portion multiplier per meal slot.
  CT.sumNutriScaled = (bySlot, mult) => Object.keys(bySlot).reduce((acc, s) => {
    const r = bySlot[s], m = (mult && mult[s]) || 1;
    for (const k in acc) acc[k] += (r.nutri[k] || 0) * m;
    return acc;
  }, ZERO());

  // What is planned / eaten today, including extras logged manually or via Claude.
  CT.dayNutri = (date) => {
    const plan = (CT.state.plans[date] || {});
    const log = CT.state.log[date] || {};
    const planned = ZERO(), eaten = ZERO();
    for (const slot of CT.SLOT_ORDER) {
      const s = plan[slot]; if (!s) continue;
      const r = CT.recipe(s.id); if (!r) continue;
      const m = s.mult || 1;
      for (const k in planned) planned[k] += (r.nutri[k] || 0) * m;
      if (s.done) for (const k in eaten) eaten[k] += (r.nutri[k] || 0) * m;
    }
    for (const x of log.extra || []) {
      for (const k of ['kcal', 'p', 'c', 'fib', 'fat', 'sf', 'sug', 'na']) { eaten[k] += Number(x[k]) || 0; planned[k] += Number(x[k]) || 0; }
    }
    return { planned, eaten, cost: planned.cost };
  };
})();

} catch (ctLoadError) { console.error('CookThis: js/nutrition.js failed to load', ctLoadError); }

// ==== js/store.js
try {
/* State, persistence (localStorage) and optional cross-device sync through the Artifact db capability. */
(function () {
  const KEY = 'cookthis.v1';
  const PARTS = ['main', 'plans', 'log', 'custom'];

  CT.defaultState = () => ({
    v: 1,
    setupDone: false,
    startDate: CT.today(),
    profile: { name: '', sex: 'm', age: 32, height: 178, weight: 80, activity: 'light', goal: 'lose' },
    focus: { ldl: true, tg: true, liver: true, uric: true, glucose: true, thyroid: true },
    prefs: { likes: {}, allergens: [], diet: 'omni', maxActive: 15, meals: { B: true, L: true, D: true, S: true }, equipment: { stove: true, oven: true, microwave: true, blender: true }, budget: 'normal', lazy: false, cuisine: 'italian', chickenPerWeek: 0 },
    settings: { theme: 'auto', palette: CT.DEFAULT_PALETTE },
    favorites: [], ratings: {}, expanded: {},
    labs: [JSON.parse(JSON.stringify(CT.INITIAL_LABS))],
    nextCheckup: (window.CT_CONFIG || {}).nextCheckup || '',
    doctorNotes: '',
    weights: [],
    achievements: {},
    shopChecked: {},
    chat: [],
    plans: {},
    log: {},
    custom: [],
    meta: { updatedAt: { main: 0, plans: 0, log: 0, custom: 0 } },
  });

  const partOf = (state, part) => {
    if (part === 'plans') return state.plans;
    if (part === 'log') return state.log;
    if (part === 'custom') return state.custom;
    const { plans, log, custom, meta, ...main } = state;
    return main;
  };
  const applyPart = (state, part, data) => {
    if (part === 'plans') state.plans = data || {};
    else if (part === 'log') state.log = data || {};
    else if (part === 'custom') state.custom = data || [];
    else Object.assign(state, data || {});
  };

  CT.load = () => {
    let s = CT.defaultState();
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        s = deepMerge(s, saved);
      }
    } catch (e) { /* fresh start */ }
    CT.state = s;
    return s;
  };

  function deepMerge(base, over) {
    if (Array.isArray(over)) return over;
    if (over && typeof over === 'object') {
      const out = Object.assign({}, base || {});
      for (const k of Object.keys(over)) out[k] = (base && typeof base[k] === 'object' && !Array.isArray(base[k])) ? deepMerge(base[k], over[k]) : over[k];
      return out;
    }
    return over === undefined ? base : over;
  }

  const pendingParts = new Set();
  const flushRemote = CT.debounce(() => {
    if (!CT.db) { pendingParts.clear(); return; }
    for (const part of pendingParts) {
      const body = { updatedAt: CT.state.meta.updatedAt[part], data: partOf(CT.state, part) };
      CT.db.doc('cookthis/' + part).set(body).catch((e) => { CT.syncStatus = 'error'; console.warn('db write failed', e); CT.renderSyncBadge && CT.renderSyncBadge(); });
    }
    pendingParts.clear();
  }, 900);

  // Save one or more parts ('main' | 'plans' | 'log' | 'custom'). Defaults to 'main'.
  CT.save = (...parts) => {
    if (!parts.length) parts = ['main'];
    const now = Date.now();
    for (const p of parts) { CT.state.meta.updatedAt[p] = now; pendingParts.add(p); }
    persistLocal();
    flushRemote();
  };

  CT.syncStatus = 'local';
  CT.syncInit = async () => {
    if (!(window.claude && typeof window.claude.use === 'function')) return false;
    let db = null;
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) return false;
    CT.db = db;
    CT.syncStatus = 'syncing';
    let changed = false;
    for (const part of PARTS) {
      const ref = db.doc('cookthis/' + part);
      try {
        const snap = await ref.get();
        const local = CT.state.meta.updatedAt[part] || 0;
        if (snap.exists) {
          const body = snap.data();
          if ((body.updatedAt || 0) > local) { applyPart(CT.state, part, body.data); CT.state.meta.updatedAt[part] = body.updatedAt; changed = true; }
          else if (local > (body.updatedAt || 0)) pendingParts.add(part);
        } else if (local > 0 || (part === 'main' && CT.state.setupDone)) {
          pendingParts.add(part);
        }

          if (!s.exists || s.metadata.hasPendingWrites) return;
          const body = s.data();
          if ((body.updatedAt || 0) > (CT.state.meta.updatedAt[part] || 0)) {
            applyPart(CT.state, part, body.data);
            CT.state.meta.updatedAt[part] = body.updatedAt;
            persistLocal();
            CT.render && CT.render();
            CT.toast('Synced from your other device');
          }
        }, () => { CT.syncStatus = 'error'; CT.renderSyncBadge && CT.renderSyncBadge(); });
      } catch (e) { CT.syncStatus = 'error'; console.warn('db read failed', e); }
    }

    if (pendingParts.size) flushRemote();
    if (CT.syncStatus !== 'error') CT.syncStatus = 'synced';
    CT.renderSyncBadge && CT.renderSyncBadge();
    return changed;
  };

  // ---- Export / import for the standalone version
  CT.exportData = () => JSON.stringify(CT.state, null, 1);
  CT.importData = (text) => {
    const obj = JSON.parse(text);
    if (!obj || typeof obj !== 'object' || !obj.profile) throw new Error('Not a CookThis backup');
    CT.state = deepMerge(CT.defaultState(), obj);
    CT.save('main', 'plans', 'log', 'custom');

  // ---- Derived statistics for streaks and achievements
  CT.stats = () => {
    const s = CT.state, today = CT.today();
    const dates = Object.keys(s.log).sort();
    let mealsCooked = 0, legumeMeals = 0, batchMeals = 0, waterDays = 0;
    const distinct = new Set();
    const cookedOn = new Set();
    for (const d of dates) {
      const l = s.log[d];
      const ids = Object.values(l.cooked || {}).filter(Boolean);
      if (ids.length) cookedOn.add(d);
      for (const id of ids) {
        mealsCooked++; distinct.add(id);
        const r = CT.recipe(id);
        if (r && r.legume) legumeMeals++;
        if (r && r.tags.includes('batch')) batchMeals++;
      }
      if ((l.water || 0) >= 8) waterDays++;
    }
    // Current cooking streak: consecutive days ending today or yesterday
    let streak = 0, cursor = cookedOn.has(today) ? today : CT.addDays(today, -1);
    while (cookedOn.has(cursor)) { streak++; cursor = CT.addDays(cursor, -1); }

  };

    CT.state.plans[date] = CT.state.plans[date] || {};

    if (prev && prev.id !== id) alts.unshift(prev.id);
    plan[slot] = { id, alts: alts.slice(0, 6), mult: prev && prev.manual ? prev.mult : 1, manual: !!(prev && prev.manual), done: false, locked: prev ? prev.locked : false };
    CT.refitDay(date);
    CT.save('plans');
  };

  CT.slotChoices = (date, slot) => {
    const plan = CT.state.plans[date] || {};

    const allergens = s.prefs.allergens.map((a) => (CT.ALLERGENS.find((x) => x[0] === a) || [])[1]).filter(Boolean).join(', ') || 'none';
    const plan = s.plans[today] || {};
    const planLines = CT.SLOT_ORDER.filter((k) => plan[k]).map((k) => { const r = CT.recipe(plan[k].id); return r ? `${CT.SLOTS[k].en}: ${r.name}${plan[k].done ? ' (eaten)' : ''}` : null; }).filter(Boolean).join('; ') || 'nothing planned yet';
    const recent = [];
    for (let i = 1; i <= 7; i++) {
      const d = CT.addDays(today, -i), l = s.log[d]; if (!l) continue;
      const ids = Object.values(l.cooked || {}).map((id) => (CT.recipe(id) || {}).name).filter(Boolean);
      const extras = (l.extra || []).map((x) => x.name);
      const slips = (l.slips || []).map((x) => x.what);
      if (ids.length || extras.length || slips.length) recent.push(`${d}: cooked ${ids.join(', ') || '-'}${extras.length ? '; also ate ' + extras.join(', ') : ''}${slips.length ? '; slipped: ' + slips.join(', ') : ''}`);
    }
    const st = CT.stats();
    return `PROFILE: ${p.name ? p.name + ', ' : ''}${p.sex === 'f' ? 'female' : 'male'}, ${p.age} y, ${p.height} cm, ${p.weight} kg (BMI ${CT.fmt(T.bmi, 1)}), activity ${p.activity}, goal ${p.goal === 'lose' ? 'gentle weight loss' : 'maintain weight'}.
BLOOD TEST (${labs.date}): ${labLines}.
HEALTH FOCUS: ${focus}.
DAILY TARGETS: ${T.kcal} kcal, protein ${T.p} g, fibre ${T.fib} g, saturated fat under ${T.sf} g, total sugars under ${T.sug} g, sodium under ${T.na} mg, omega-3 about ${T.o3} g.
PREFERENCES: likes ${likes}; dislikes ${dislikes}; allergies/intolerances ${allergens}; diet ${s.prefs.diet}; max hands-on time ${s.prefs.maxActive} min; kitchen: ${Object.keys(s.prefs.equipment).filter((k) => s.prefs.equipment[k]).join(', ')}.
TODAY (${today}) PLAN: ${planLines}. Water today: ${(s.log[today] || {}).water || 0}/8 glasses.
RECENT DAYS: ${recent.join(' | ') || 'no history yet'}.
STREAKS: cooking streak ${st.cookStreak} days, ${st.slipFreeDays} days without cured meat, fish meals this week ${st.fishThisWeek}.`;
  },

  ingredientCatalogue() {
    return Object.values(CT.ING).filter((i) => !CT.PANTRY.has(i.id) || i.id === 'evoo' || i.id === 'salt').map((i) => `${i.id}=${i.en}`).join(', ');
  },

  RECIPE_SHAPE: `Reply with ONLY one JSON object, no prose, in exactly this shape:
{"name": "Recipe name", "it": "Nome italiano", "slots": ["L"], "time": 15, "active": 10, "needs": ["stove"], "tags": ["one-pan"],
 "ingredients": [ {"id": "chicken", "g": 130, "disp": "1 small breast"}, {"name": "Fennel", "it": "finocchio", "g": 150, "disp": "1 bulb", "aisle": "Produce", "per100": {"kcal": 31, "p": 1.2, "c": 7, "fib": 3.1, "fat": 0.2, "sf": 0, "sug": 4, "na": 52}, "price": 3, "flags": "", "pur": 0, "o3": 0} ],
 "steps": ["Step one.", "Step two (5 min)."], "note": "One sentence on why it suits this person's blood work."}
Rules: one serving; grams for every ingredient; use an "id" from the catalogue whenever the ingredient exists there (then omit per100); for anything else give realistic per-100 g values. slots use B/L/D/S. needs may include stove, oven, microwave, blender. flags letters: F fish, S shellfish, E egg, D dairy, G gluten, N nuts, Y soy, Z sesame, M meat, R red meat. Keep hands-on time at or under the person's limit, ingredients cheap and available in an Italian supermarket, saturated fat low, fibre high.`,

  async chat(turns, opts = {}) {
    const sample = await this.get(); if (!sample) throw { code: 'not_granted' };
    const input = [{ role: 'user', content: this.RULES + '\n\n' + this.context() }, ...turns.slice(-16)];
    return sample(input, { cache: false, onText: opts.onText, signal: opts.signal, modelTier: 'default', tools: CT.aiTools() });
  },

  async createRecipe(brief, opts = {}) {
    const sample = await this.get(); if (!sample) throw { code: 'not_granted' };
    const prompt = `${this.RULES}\n\n${this.context()}\n\nINGREDIENT CATALOGUE (id=name): ${this.ingredientCatalogue()}\n\nTASK: ${brief}\n\n${this.RECIPE_SHAPE}`;
    const obj = await sample.json(prompt, { cache: false, onText: opts.onText, signal: opts.signal });
    return CT.recipeFromAI(obj);
  },

  // A detailed walkthrough of one recipe. Deliberately built from the recipe alone rather than the
  // full profile context, so the answer is stable and the five-minute cache can actually hit.
  async expandMethod(r, portion, opts = {}) {
    const sample = await this.get(); if (!sample) throw { code: 'not_granted' };
    const k = portion || 1;
    const ing = r.ings.map((i) => `${k === 1 ? i.disp : (CT.fmt(i.g * k) + ' g')} ${i.en}${i.opt ? ' (optional)' : ''}`).join('; ');
    const prompt = `You are the built-in cooking coach of CookThis, writing for someone who cooks fast, simple food and wants to follow this exact recipe without guessing. They cook in an Italian kitchen with metric measures.

RECIPE: ${r.name}${r.it ? ` (${r.it})` : ''}
PORTION: ${k === 1 ? 'one serving' : k + ' servings worth, quantities below are already scaled'}
EQUIPMENT AVAILABLE: ${r.needs.length ? r.needs.join(', ') : 'no cooking equipment needed'}
INGREDIENTS: ${ing}
SHORT METHOD AS WRITTEN: ${r.steps.map((s, i) => `${i + 1}. ${s}`).join(' ')}

TASK: Rewrite the method as a detailed walkthrough of this same dish. Keep the same ingredients and the same result: do not invent a different recipe and do not add ingredients beyond salt, pepper or a herb already listed. Cover, in numbered steps: what to get out and prepare before the heat goes on; how each thing is cut and to what size; the heat level and the pan; exact timings with the sign to look for rather than only the clock (what it should look, sound or smell like); how to tell when the protein or the pasta is done; what to do during the waiting; and how to finish and plate it. End with two short lines: one titled "Easy to get wrong" naming the single most common mistake in this dish, and one titled "Keeps" saying how to store and reheat leftovers. Plain text, no markdown headings or bold, under 400 words.`;
    return sample(prompt, { cache: { gcTime: 24 * 3600 * 1000 }, onText: opts.onText, signal: opts.signal, modelTier: 'default' });
  },

  /* Autocomplete for the "log what you ate" box. Runs on a typing pause, on the quick tier, with a
     tight prompt and the default answer cache, so repeating a food costs nothing. */
  async suggestFoods(text, opts = {}) {
    const sample = await this.get(); if (!sample) throw { code: 'not_granted' };
    const q = String(text || '').trim().slice(0, 80);
    const prompt = `Someone is logging what they ate into a food diary, in an Italian context, and has typed: "${q}".
Reply with ONLY a JSON array of up to 4 objects, most likely first, each a plausible completion of what they mean, with the nutrition of ONE realistic portion as eaten:
[{"name": "Pizza margherita, whole", "portion": "1 pizza, about 300 g", "kcal": 850, "p": 35, "c": 105, "fib": 6, "fat": 30, "sf": 12, "sug": 9, "na": 1800}]
Rules: name is short and specific, in the language they typed; portion names a realistic serving with grams or a household measure; numbers are grams for the whole portion, sodium in mg; if they already named a size or quantity, honour it; prefer Italian dishes and supermarket products when the text is Italian. No prose, no markdown.`;
    return sample.json(prompt, { modelTier: 'quick', signal: opts.signal });
  },

  async analyzeMeal(text, images, opts = {}) {
    const sample = await this.get(); if (!sample) throw { code: 'not_granted' };
    const prompt = `${this.RULES}\n\n${this.context()}\n\nTASK: The person ate something off-plan and describes it${images && images.length ? ' and attached a photo of the plate' : ''}: "${text || 'see photo'}". Estimate the nutrition of the portion as eaten and judge it against their targets and blood work.
Reply with ONLY one JSON object: {"name": "short name of the meal", "kcal": 0, "p": 0, "c": 0, "fib": 0, "fat": 0, "sf": 0, "sug": 0, "na": 0, "verdict": "good|ok|poor", "comment": "two sentences: what was good, what to adjust", "better": "one concrete swap for next time"}. Numbers are grams (sodium in mg) for the whole portion.`;
    const o = { cache: false, onText: opts.onText, signal: opts.signal };
    if (images && images.length) o.images = images;
    return sample.json(prompt, o);
  },

  async explainLabs(opts = {}) {
    const sample = await this.get(); if (!sample) throw { code: 'not_granted' };
    const prompt = `${this.RULES}\n\n${this.context()}\n\nTASK: Explain this blood test in plain language for the person, as their app's dietician (not their doctor). Structure: 1) the two or three things that matter most and how they connect (e.g. thyroid and cholesterol, triglycerides and liver); 2) what is fine and can be ignored; 3) the four food habits with the biggest expected effect on THESE numbers, in order; 4) what to ask the doctor at the next visit. Use short paragraphs and plain words, no markdown headings, under 350 words. Do not repeat the numbers table.`;
    return sample(prompt, { cache: { gcTime: 24 * 3600 * 1000 }, onText: opts.onText, signal: opts.signal, modelTier: 'default' });
  },

  async weeklyReview(opts = {}) {
    const sample = await this.get(); if (!sample) throw { code: 'not_granted' };
    const prompt = `${this.RULES}\n\n${this.context()}\n\nTASK: Review the last 7 days from the RECENT DAYS and STREAKS data. Give: one sentence of honest encouragement; the three things going well; the two habits to fix next week with a concrete, lazy-friendly action each; and one recipe idea for the coming week that fits their likes. Under 220 words, plain text, no headings.`;
    return sample(prompt, { cache: false, onText: opts.onText, signal: opts.signal });
  },
};

// Validate and normalise a recipe object produced by Claude into the app's recipe format.
CT.recipeFromAI = (o) => {
  if (!o || typeof o !== 'object' || !o.name || !Array.isArray(o.ingredients) || !Array.isArray(o.steps)) throw { code: 'invalid_json', message: 'missing fields' };
  const slots = (Array.isArray(o.slots) ? o.slots : ['L']).map((s) => String(s).toUpperCase()[0]).filter((s) => CT.SLOTS[s]);
  const needs = (Array.isArray(o.needs) ? o.needs : []).map(String).filter((n) => ['stove', 'oven', 'microwave', 'blender'].includes(n));
  const ing = o.ingredients.map((x) => {
    if (!x || typeof x !== 'object') return null;
    const g = Math.max(0, Number(x.g) || 0); if (!g) return null;
    if (x.id && CT.ING[x.id]) return [x.id, g, x.disp ? String(x.disp) : undefined, !!x.opt];
    const per100 = x.per100 || {};
    const num = (v) => Math.max(0, Number(v) || 0);
    return { name: String(x.name || 'Ingredient').slice(0, 60), it: String(x.it || '').slice(0, 60), g, disp: x.disp ? String(x.disp).slice(0, 40) : undefined, aisle: CT.AISLES.includes(x.aisle) ? x.aisle : 'Canned & dry',
      per100: { kcal: num(per100.kcal), p: num(per100.p), c: num(per100.c), fib: num(per100.fib), fat: num(per100.fat), sf: num(per100.sf), sug: num(per100.sug), na: num(per100.na) },
      price: num(x.price) || 5, flags: String(x.flags || '').replace(/[^FSEDGNYZMRIL]/g, ''), pur: CT.clamp(Math.round(num(x.pur)), 0, 3), o3: num(x.o3), tag: '' };
  }).filter(Boolean);
  if (!ing.length) throw { code: 'invalid_json', message: 'no ingredients' };
  return {
    id: 'custom_' + CT.uid(), custom: true, created: CT.today(),
    name: String(o.name).slice(0, 90), it: String(o.it || '').slice(0, 90),
    slots: slots.length ? slots : ['L'], time: CT.clamp(Math.round(Number(o.time) || 15), 1, 120), active: CT.clamp(Math.round(Number(o.active) || Number(o.time) || 10), 1, 120),
    needs, tags: ['custom', ...(Array.isArray(o.tags) ? o.tags.map(String).slice(0, 6) : [])],
    ing, steps: o.steps.map((s) => String(s).slice(0, 300)).slice(0, 12), note: o.note ? String(o.note).slice(0, 240) : '',
  };
};

} catch (ctLoadError) { console.error('CookThis: js/ai.js failed to load', ctLoadError); }

// ==== js/ai-tools.js
try {
/* Page functions Claude may call while answering in the chat.
   Reads are cheap; the two writers change the plan, and because the shopping list is generated
   from the plan it updates with them. Every write is recorded so the chat can offer a one-tap undo. */
(function () {
  // This file loads before the views, which are where these namespaces are normally created.
  CT.ui = CT.ui || {}; CT.actions = CT.actions || {};
  const resolveDate = (v) => {
    const s = String(v == null ? '' : v).trim().toLowerCase();
    if (!s || s === 'today') return CT.today();
    if (s === 'tomorrow') return CT.addDays(CT.today(), 1);
    if (s === 'yesterday') return CT.addDays(CT.today(), -1);
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    for (let i = 0; i < 7; i++) { const d = CT.addDays(CT.today(), i); if (CT.fmtDate(d, 'day').toLowerCase() === s) return d; }
    throw new Error('Unknown date "' + v + '". Use YYYY-MM-DD, "today", "tomorrow" or a weekday name within the next week.');
  };
  const SLOT_WORDS = { BREAKFAST: 'B', COLAZIONE: 'B', LUNCH: 'L', PRANZO: 'L', DINNER: 'D', CENA: 'D', SNACK: 'S', SPUNTINO: 'S' };
  const resolveSlot = (v) => {
    const s = String(v == null ? '' : v).trim().toUpperCase();
    const k = SLOT_WORDS[s] || s[0];
    if (!CT.SLOTS[k]) throw new Error('slot must be breakfast, lunch, dinner or snack');
    return k;
  };
  const dayTotals = (date) => {
    const n = CT.dayNutri(date).planned, T = CT.targets();
    return { kcal: Math.round(n.kcal), target_kcal: T.kcal, protein_g: Math.round(n.p), fibre_g: Math.round(n.fib),
      saturated_fat_g: +n.sf.toFixed(1), sugars_g: Math.round(n.sug), sodium_mg: Math.round(n.na),
      omega3_g: +n.o3.toFixed(1), cost_eur: +n.cost.toFixed(2) };
  };
  const brief = (r) => ({ id: r.id, name: r.name, meals: r.slots.map((s) => CT.SLOTS[s].en), hands_on_min: r.active,
    total_min: r.time, kcal: Math.round(r.nutri.kcal), fibre_g: Math.round(r.nutri.fib),
    saturated_fat_g: +r.nutri.sf.toFixed(1), cost_eur: +r.cost.toFixed(2), tags: r.tags });

  CT.ui.planEdits = CT.ui.planEdits || [];
  const noteEdit = (date, slot, prevId, r) => {
    CT.ui.planEdits.push({ date, slot, prevId, newId: r.id, newName: r.name });
    CT.toast(CT.SLOTS[slot].en + ' ' + CT.relDay(date).toLowerCase() + ': ' + r.name, 'good');
  };
  const guardCooked = (date, slot) => {
    const s = (CT.state.plans[date] || {})[slot];
    if (s && s.done) throw new Error('The ' + CT.SLOTS[slot].en.toLowerCase() + ' on ' + date + ' is already marked as cooked, so it must not be replaced. Pick another slot, or ask the person first.');
  };

  CT.aiTools = () => [
    {
      name: 'get_plan',
      description: 'Read what is currently planned. Returns one entry per planned meal with its date, meal slot, recipe id and name, hands-on minutes, calories, and whether it is already cooked or locked. Call it before changing anything.',
      inputSchema: { type: 'object', properties: { days: { type: 'number', description: 'How many days from today, 1-7. Default 7.' } } },
      execute: ({ days }) => {
        const n = Math.max(1, Math.min(7, Number(days) || 7));
        const meals = [];
        for (let i = 0; i < n; i++) {
          const d = CT.addDays(CT.today(), i), plan = CT.ensurePlan(d);
          for (const s of CT.enabledSlots()) {
            const p = plan[s], r = p && CT.recipe(p.id); if (!r) continue;
            meals.push({ date: d, when: CT.relDay(d), slot: CT.SLOTS[s].en, recipeId: r.id, name: r.name,
              hands_on_min: r.active, portion: p.mult || 1, kcal: Math.round(r.nutri.kcal * (p.mult || 1)),
              cooked: !!p.done, locked: !!p.locked });
          }
        }
        return { today: CT.today(), meals };
      },
    },
    {
      name: 'get_recipe',
      description: 'Read one recipe in full: ingredients in grams with their catalogue ids, method steps, nutrition per serving and cost. Call it before adapting a recipe, so the variant keeps everything that was not asked to change.',
      inputSchema: { type: 'object', properties: { recipeId: { type: 'string' } }, required: ['recipeId'] },
      execute: ({ recipeId }) => {
        const r = CT.recipe(String(recipeId || ''));
        if (!r) throw new Error('No recipe with id "' + recipeId + '".');
        return {
          id: r.id, name: r.name, it: r.it, slots: r.slots, time: r.time, active: r.active, needs: r.needs, tags: r.tags,
          ingredients: r.ings.map((i) => ({ id: i.id, name: i.en, g: i.g, disp: i.disp, optional: i.opt })),
          steps: r.steps, note: r.note || '',
          nutrition: { kcal: Math.round(r.nutri.kcal), protein_g: Math.round(r.nutri.p), fibre_g: +r.nutri.fib.toFixed(1),
            saturated_fat_g: +r.nutri.sf.toFixed(1), sugars_g: Math.round(r.nutri.sug), sodium_mg: Math.round(r.nutri.na),
            omega3_g: +r.nutri.o3.toFixed(2) },
          cost_eur: +r.cost.toFixed(2),
        };
      },
    },
    {
      name: 'find_recipes',
      description: 'Search the recipe library by words in the name or ingredients, filtered by meal slot and hands-on time. Returns up to 12 compact matches with their ids, best fit first, already excluding this person’s dislikes and allergens. Use it to get a recipeId for set_meal.',
      inputSchema: { type: 'object', properties: {
        query: { type: 'string', description: 'Words to match in the name or ingredients, English or Italian. Optional.' },
        slot: { type: 'string', description: 'breakfast, lunch, dinner or snack. Optional.' },
        maxActiveMinutes: { type: 'number' }, limit: { type: 'number' } } },
      execute: ({ query, slot, maxActiveMinutes, limit }) => {
        const q = String(query || '').trim().toLowerCase();
        const sl = slot ? resolveSlot(slot) : null;
        const maxMin = Number(maxActiveMinutes) || 0;
        const list = CT.recipes().filter((r) => {
          if (sl && !r.slots.includes(sl)) return false;
          if (maxMin && r.active > maxMin) return false;
          if (r.allergens.some((a) => CT.state.prefs.allergens.includes(a))) return false;
          if (r.foods.some((f) => CT.state.prefs.likes[f] === -1)) return false;
          if (!q) return true;
          return r.name.toLowerCase().includes(q) || (r.it || '').toLowerCase().includes(q)
            || r.ings.some((i) => i.en.toLowerCase().includes(q) || i.it.toLowerCase().includes(q));
        }).sort((a, b) => CT.matchScore(b) - CT.matchScore(a)).slice(0, Math.max(1, Math.min(12, Number(limit) || 12)));
        return { count: list.length, recipes: list.map(brief) };
      },
    },
    {
      name: 'set_meal',
      description: 'Put an existing recipe into a day and meal slot, replacing what was there. The shopping list is generated from the plan, so it updates too. Returns the day totals after the change.',
      inputSchema: { type: 'object', properties: {
        date: { type: 'string', description: 'YYYY-MM-DD, "today", "tomorrow" or a weekday name.' },
        slot: { type: 'string', description: 'breakfast, lunch, dinner or snack' },
        recipeId: { type: 'string' },
        portion: { type: 'number', description: 'Optional portion multiplier, for example 1.5 for a bigger plate. Leave it out and the app sizes the day to the calorie target itself.' } },
        required: ['date', 'slot', 'recipeId'] },
      execute: ({ date, slot, recipeId, portion }) => {
        const d = resolveDate(date), sl = resolveSlot(slot);
        const r = CT.recipe(String(recipeId || ''));
        if (!r) throw new Error('No recipe with id "' + recipeId + '". Call find_recipes first and use an id it returned.');
        guardCooked(d, sl);
        const prev = (CT.state.plans[d] || {})[sl];
        const prevName = prev ? (CT.recipe(prev.id) || {}).name : null;
        CT.setSlot(d, sl, r.id);
        if (Number(portion) > 0) CT.setPortion(d, sl, Number(portion));
        noteEdit(d, sl, prev ? prev.id : null, r);
        return { ok: true, date: d, slot: CT.SLOTS[sl].en, planned: r.name, replaced: prevName,
          portion: (CT.state.plans[d][sl] || {}).mult || 1, day_totals: dayTotals(d), shopping_list_updated: true };
      },
    },
    {
      name: 'save_recipe_and_plan',
      description: 'Save a new or adapted recipe to the person’s own recipes and optionally plan it for a day and meal slot. Use it to act on a refinement, for example the same dish without an ingredient they dislike. Returns the saved recipe with its computed nutrition and cost.',
      inputSchema: { type: 'object', properties: {
        recipe: { type: 'object', description: 'One serving. Fields: name, it (Italian name), slots (array of B/L/D/S), time, active, needs (stove/oven/microwave/blender), tags, steps (array of strings), note, and ingredients: an array of {id, g, disp} using catalogue ids where the ingredient exists, otherwise {name, it, g, disp, aisle, price, flags, per100:{kcal,p,c,fib,fat,sf,sug,na}}.' },
        date: { type: 'string', description: 'Optional. Plan it for this day.' },
        slot: { type: 'string', description: 'Optional. breakfast, lunch, dinner or snack.' } }, required: ['recipe'] },
      execute: ({ recipe, date, slot }) => {
        let r;
        try { r = CT.recipeFromAI(recipe); }
        catch (e) { throw new Error('That recipe could not be read: ' + ((e && e.message) || 'check the ingredients array and the required fields') + '.'); }
        CT.state.custom.push(r);
        CT.save('custom');
        const p = CT.prepRecipe(r);
        const res = { ok: true, recipeId: p.id, name: p.name, kcal: Math.round(p.nutri.kcal),
          fibre_g: +p.nutri.fib.toFixed(1), saturated_fat_g: +p.nutri.sf.toFixed(1), cost_eur: +p.cost.toFixed(2), planned: false };
        if (date && slot) {
          const d = resolveDate(date), sl = resolveSlot(slot);
          guardCooked(d, sl);
          const prev = (CT.state.plans[d] || {})[sl];
          res.replaced = prev ? (CT.recipe(prev.id) || {}).name : null;
          CT.setSlot(d, sl, p.id);
          noteEdit(d, sl, prev ? prev.id : null, p);
          res.planned = true; res.date = d; res.slot = CT.SLOTS[sl].en;
          res.day_totals = dayTotals(d); res.shopping_list_updated = true;
        }
        return res;
      },
    },
    {
      name: 'get_shopping_list',
      description: 'The shopping list generated from the current plan, grouped by supermarket aisle, with Italian names and quantities. Meals already cooked are left out. Use it to answer what to buy, or to show what a change added.',
      inputSchema: { type: 'object', properties: { days: { type: 'number', description: 'How many days from today, 1-7. Default 7.' } } },
      execute: ({ days }) => {
        const n = Math.max(1, Math.min(7, Number(days) || 7));
        const dates = Array.from({ length: n }, (_, i) => CT.addDays(CT.today(), i));
        const { items, cost } = CT.shoppingList(dates);
        const aisles = {};
        for (const it of items) {
          if (it.pantry) continue;
          (aisles[it.aisle] = aisles[it.aisle] || []).push(it.en + ' (' + it.it + ') - ' + CT.qtyText(it));
        }
        return { days: n, approx_cost_eur: +cost.toFixed(2), aisles };
      },
    },
  ];

  // ---- Undo for whatever Claude changed in this session
  CT.actions['ai-undo-plan'] = () => {
    const edits = CT.ui.planEdits || [];
    for (let i = edits.length - 1; i >= 0; i--) {
      const e = edits[i];
      if (e.prevId && CT.recipe(e.prevId)) CT.setSlot(e.date, e.slot, e.prevId);
      else if (CT.state.plans[e.date]) delete CT.state.plans[e.date][e.slot];
    }
    CT.save('plans');
    CT.ui.planEdits = [];
    CT.toast('Plan put back the way it was.');
    CT.render();
  };
  CT.actions['ai-keep-plan'] = () => { CT.ui.planEdits = []; CT.render(); };
})();
